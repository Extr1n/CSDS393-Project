<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 70%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .btn-primary{
          display: inline-block;
          padding: 10px 20px;
          background-color: #4CAF50;
          color: white;
          text-decoration: none; border-radius: 5px;
          margin-top: 20px;
        }
    </style>
</head>
<body>
  <div class="container">
    <h1>AI Advisor Response</h1>
    <h3>Your Question</h3>
    {% if user_input %}
        <p>{{ user_input }}</p>
    {% else %}
        <p>No input received</p>
    {% endif %}
    <h3>Advisor Answer</h3>
    {% if chat_completion  %}
        <p>{{ chat_completion }}</p>
    {% else %}
        <p>No answer recieved</p>
    {% endif %}
    <a href="{{ url_for('index') }}" class="btn btn-primary">Go Back</a>
  </div>
</body>
</html>
